query findDashboardHelpPages($where: DashboardHelpPage_where) {
    DashboardHelpPages: DashboardHelpPages(where: $where) {
        docs {
            id
            slug
            title
            updatedAt
            createdAt
        }
        hasNextPage
        hasPrevPage
        limit
        nextPage
        offset
        page
        pagingCounter
        prevPage
        totalDocs
        totalPages
    }
}
